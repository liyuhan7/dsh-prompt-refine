name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支的新推送取消上一次仍在跑的检查。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Test & verify bundle
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 测试使用 module.registerHooks，开发环境需要 Node 22.15 或更高版本。
        node: [22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # package-lock.json 已入库，用 ci 保证依赖可复现。
      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: |
          for file in lib/*.js scripts/*.js; do
            node --check "$file"
          done

      - name: Verify committed bundle matches sources
        run: npm run build:check

      # 一次 npm test 即覆盖全部用例（pretest 会先重建产物）。
      - name: Run tests
        run: npm test
